function dashboard(){let outgoing=txs.filter(t=>t.senderVpa==='alice@demo'&&t.status==='SETTLED').length,queued=queue.filter(q=>q.state==='QUEUED'),monthLabels=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],monthly=Array.from({length:12},()=>({incoming:0,outgoing:0})),now=new Date();txs.filter(t=>t.status==='SETTLED'&&t.settledAt).forEach(t=>{let d=new Date(t.settledAt);if(d.getFullYear()===now.getFullYear()){if(t.receiverVpa==='alice@demo')monthly[d.getMonth()].incoming+=Number(t.amount);if(t.senderVpa==='alice@demo')monthly[d.getMonth()].outgoing+=Number(t.amount)}});let max=Math.max(1,...monthly.map(x=>Math.max(x.incoming,x.outgoing))),counter={};txs.filter(t=>t.status==='SETTLED').forEach(t=>{let name=t.senderVpa==='alice@demo'?t.receiverVpa:t.senderVpa;counter[name]=(counter[name]||0)+Number(t.amount)});let tops=Object.entries(counter).sort((a,b)=>b[1]-a[1]).slice(0,3),sum=tops.reduce((a,x)=>a+x[1],0)||1,colors=['#8b72f6','#31c9b2','#f26ca8'],deg=0,stops=tops.map((x,i)=>{let next=deg+x[1]/sum*360,seg=`${colors[i]} ${deg}deg ${next}deg`;deg=next;return seg}).join(',')||'#303149 0deg 360deg';let accountColors=['#765af2','#21bca2','#eb76a9','#55bde8'];return shell('Dashboard',`<div class="dash-heading"><div><p class="eyebrow">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}).toUpperCase()}</p><h2>Welcome back, ${esc(userName())} <span>✦</span></h2><p>Your payment activity at a glance.</p></div><div class="head-actions"><button class="btn secondary" onclick="toast('Showing the current year')">▦ &nbsp; This year⌄</button><button class="btn primary" onclick="downloadCsv()">⇩ &nbsp; Export</button></div></div><section class="dashboard-grid"><article class="card cashflow-card"><div class="card-head"><div><span class="eyebrow">CASHFLOW</span><h3>Money in motion</h3></div><div class="chart-legend"><span><i class="legend-in"></i>Incoming</span><span><i class="legend-out"></i>Outgoing</span></div> async function submitPayment(e){e.preventDefault();let q={id:crypto.randomUUID(),sender:document.getElementById('sender').value,recipient:document.getElementById('recipient').value,amount:Number(document.getElementById('amount').value),createdAt:Date.now(),state:'QUEUED'};if(q.sender===q.recipient)return toast('Choose a different recipient');queue.unshift(q);recordEvent(q,'QUEUED','Payment request saved on this device');saveq();if(online())await syncOne(q);else toast('Saved locally · not yet processed');await render()}async function syncOne(q){try{q.state='PROCESSING';recordEvent(q,'PROCESSING','Checking connection to the demo API');saveq();if(!q.packetId){let r=await api('/api/demo/send',{method:'POST',body:JSON.stringify({senderVpa:q.sender,receiverVpa:q.recipient,amount:q.amount,pin:'offline-demo',ttl:5,startDevice:'phone-alice'})});q.packetId=r.packetId;recordEvent(q,'PACKET_CREATED','Encrypted demo packet injected into phone-alice');saveq()}let gossip=await api('/api/mesh/gossip',{method:'POST'});recordEvent(q,'MESH_HOP',`${gossip.transfers} packet transfer(s) across virtual devices`);let f=await api('/api/mesh/flush',{method:'POST'}),out=f.results.map(x=>x.outcome);q.state=out.includes('SETTLED')?'SUCCESS':out.includes('REJECTED')||out.includes('INVALID')?'FAILED':out.includes('DUPLICATE_DROPPED')?'SYNCED':'QUEUED';q.reason=out.join(', ')||(q.state==='QUEUED'?'Bridge has not received the packet yet':'');q.syncedAt=Date.now();lastSyncAt=q.syncedAt;q.pin='';recordEvent(q,q.state==='SUCCESS'?'SERVER_CONFIRMED':q.state==='FAILED'?'SERVER_REJECTED':'SYNC_RESULT',`Bridge result: ${q.reason||q.state}`);saveq();toast(q.state==='SUCCESS'?'Server confirmed simulated payment':q.state==='FAILED'?'Server rejected simulated payment':'Server result: '+q.state)}catch(e){if(e.status&&e.status<500){q.state='FAILED';q.reason=e.message;q.syncedAt=Date.now();recordEvent(q,'SERVER_REJECTED',e.message);saveq();toast('Request rejected · '+e.message)}else{q.state='QUEUED';q.retryCount function txPage(){let rows=txs.map(t=>`<tr><td>#${t.id}</td><td>${t.senderVpa}</td><td>${t.receiverVpa}</td><td>${fmt(t.amount)}</td><td><span class="status ${t.status==='REJECTED'?'bad':''}">${t.status}</span></td><td>${t.bridgeNodeId}</td><td>${new Date(t.settledAt).toLocaleString()}</td></tr>`).join('');return shell('Transactions',`<div class="greet"><div><h1>Transactions</h1><p>Server-recorded simulated payments from the demo ledger.</p></div></div><div class="card tablewrap"><table><thead><tr><th>Reference</th><th>From</th><th>To</th><th>Amount</th><th>Status</th><th>Bridge</th><th>Processed</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">No server transactions recorded yet.</td></tr>'}</tbody></table></div>`)}function receivePage(){return shell('Receive money',`<div class="greet"><div><h1>Receive money</h1><p>Share your demo payment identifier.</p></div></div><div class="pagegrid"><div class="card" style="text-align:center;padding:32px"><div style="font-size:60px;color:var(--v)">▦</div><h2 style="font:700 19px Manrope">alice@demo</h2><p class="foot">Demo account · Alice</p><button class="btn primary" onclick="navigator.clipboard.writeText('alice@demo').then(()=>toast('Payment ID copied'))">Copy payment ID</button><p class="foot">QR generation is not part of the existing backend; share the VPA.</p></div><div class="card"><h2 style="font:700 15px Manrope">How receiving works</h2><p class="foot" style="line-height:1.8">A participant can select alice@demo in Send Money. The demo ledger updates only after simulated server processing.</p></div></div>`)}function scanPage(){return shell('Scan & Pay',`<div class="dash-heading"><div><p class="eyebrow">FAST, SIMPLE, SIMULATED</p><h2>Scan & pay</h2><p>Find a demo recipient and prepare a simulated payment.</p></div></div><div class="scan-layout"><div class="scanner-phone"><div class="scan-screen"><div class="phone-notch"></div><h3>Scan a QR code</h3><p>Align the QR inside the frame to find a demo recipie ov','Dec'],byMonth=Array.from({length:12},()=>({in:0,out:0})),year=new Date().getFullYear();ok.forEach(t=>{let d=new Date(t.settledAt);if(d.getFullYear()===year){if(t.receiverVpa==='alice@demo')byMonth[d.getMonth()].in+=Number(t.amount);if(t.senderVpa==='alice@demo')byMonth[d.getMonth()].out+=Number(t.amount)}});let max=Math.max(1,...byMonth.map(x=>Math.max(x.in,x.out)));return shell('Analytics',`<div class="dash-heading"><div><p class="eyebrow">YOUR FINANCIAL PICTURE</p><h2>Analytics</h2><p>Every figure is calculated from the simulated server ledger.</p></div><button class="btn primary" onclick="downloadCsv()">⇩ &nbsp; Export data</button></div><section class="stats">${stat('Simulated volume',fmt(volume),'Confirmed server ledger','◉')}${stat('Successful',ok.length,'Settled records','✓')}${stat('Rejected',bad.length,'Rejected by server','!')}${stat('Local queue',queue.filter(q=>q.state==='QUEUED').length,'Not in ledger yet','◷')}</section><section class="analytics-grid"><article class="card analytics-chart"><div class="card-head"><div><span class="eyebrow">YEAR TO DATE · ${year}</span><h3>Cashflow by month</h3></div><div class="chart-legend"><span><i class="legend-in"></i>Incoming</span><span><i class="legend-out"></i>Outgoing</span></div></div><div class="chart-total"><b>${fmt(volume)}</b><span>confirmed simulated activity</span></div><div class="annual-chart">${byMonth.map((m,i)=>`<div class="month-group"><div class="month-bars"><div class="bar-track"><i class="income-bar" style="height:${m.in/max*100}%"></i><i class="outcome-bar" style="height:${m.out/max*100}%"></i></div></div><small>${labels[i]}</small></div>`).join('')}</div><div class="chart-axis"><span>₹0</span><span>Values from the server ledger</span><span>${fmt(max)}</span></div></article><article class="card"><div class="card-head"><div><span class="eyebrow">RECENT ACTIVITY</span><h3>Transaction records</h3></div><a href="#/dashboard/transactions">View all →</a></div><div class="recent-list">${txs.length async function inspectCrypto(){try{serverKeyInfo=await api('/api/server-key');let raw=Uint8Array.from(atob(serverKeyInfo.publicKey),c=>c.charCodeAt(0));if(crypto.subtle){let hash=new Uint8Array(await crypto.subtle.digest('SHA-256',raw));serverKeyInfo.fingerprint=Array.from(hash).slice(0,12).map(x=>x.toString(16).padStart(2,'0')).join(':').toUpperCase()}else serverKeyInfo.fingerprint='Fingerprint API unavailable'}catch{serverKeyInfo={error:'Server public key endpoint unavailable'}}await render()}
async function runGossip(){try{let r=await api('/api/mesh/gossip',{method:'POST'});recordEvent(null,'GOSSIP_ROUND',`${r.transfers} packet transfer(s); virtual mesh state refreshed`);await load();await render();toast('Mesh round complete · '+r.transfers+' transfer(s)')}catch{toast('Backend unavailable · mesh round not run')}}
function systemPage(){let devices=mesh.devices||[],queued=queue.filter(q=>q.state==='QUEUED').length;return shell('Network monitor',`<div class="dash-heading"><div><p class="eyebrow">LIVE SYSTEM VIEW · REAL ENDPOINT CHECKS</p><h2>Network monitor</h2><p>Inspect the browser, demo API, virtual mesh and local queue.</p></div><button class="btn primary" onclick="refreshDiagnostics()">↻ Refresh telemetry</button></div><section class="stats">${stat('Backend API',systemHealth.status||'UNKNOWN',systemHealth.mode||'Status endpoint','⌁')}${stat('API response',apiLatency===null?'—':apiLatency+' ms','Measured on last check','◉')}${stat('Virtual nodes',devices.length,'From /api/mesh/state','▦')}${stat('Local queue',queued,'Browser storage · not settled','◷')}</section><section class="system-grid"><article class="card"><div class="card-head"><div><span class="eyebrow">SIMULATED NETWORK</span><h3>Mesh node topology</h3></div><button class="btn secondary" <button class="btn secondary" onclick="runGossip()" ${systemHealth.readOnly==='true'?'disabled':''}>Run gossip round</button></div><p class="foot">Node states and packet counts are read from the live mesh endpoint. A gossip round only forwards packets; bridge flush can settle a payment.</p><div class="node-map">${devices.map((d,i)=>`<div class="node-card ${d.hasInternet?'bridge-node':''}"><span class="node-light ${d.hasInternet?'on':''}"></span><b>${esc(d.deviceId)}</b><small>${d.hasInternet?'BRIDGE · INTERNET':'PEER · OFFLINE'}</small><strong>${d.packetCount} packet(s)</strong>${d.packetIds?.length?`<code>${d.packetIds.map(esc).join(' · ')}</code>`:''}</div>${i<devices.length-1?'<span class="node-link">········</span>':''}`).join('')||'<div class="empty">No mesh data from server.</div>'}</div></article><article class="card crypto-card"><div class="card-head"><div><span class="eyebrow">CRYPTO PROFILE</span><h3>Packet protection</h3></div><span class="status">DEMO</span></div><div class="crypto-spec"><div><small>ENVELOPE</small><b>${serverKeyInfo?.hybridScheme?'RSA-OAEP + AES-GCM':'RSA-OAEP + AES-256-GCM'}</b></div><div><small>AUTHENTICATED CIPHER</small><b>AES-256-GCM · 128-bit tag</b></div><div><small>REPLAY CHECK</small><b>24-hour freshness window</b></div><div><small>IDEMPOTENCY</small><b>SHA-256 packet fingerprint</b></div></div><button class="btn secondary" onclick="inspectCrypto()">Inspect server public key</button>${serverKeyInfo?`<div class="key-result">${serverKeyInfo.error?esc(serverKeyInfo.error):`<b>${esc(serverKeyInfo.algorithm)}</b><small>${esc(serverKeyInfo.hybridScheme)}</small><code>SHA-256 · ${esc(serverKeyInfo.fingerprint||'Fingerprint not computed')}</code><small>Public key shown by /api/server-key · private key stays server-side.</small>`}</div>`:''}</article></section><section class="system-grid"><article class="card"><div class="card-head"><div><span class="eyebrow">REQUEST TRACE · THIS BROWSER</span><h3>Recent sync events</h3></div><span class="foot">${activityLog.length} local event(s)</span></div><div class="event-list">${activityLog.length?activityLog.slice(0,8).map(e=>`<div class="event-row"><i class="event-dot ${e.state==='SERVER_CONFIRMED'?'good':e.state==='SERVER_REJECTED'?'bad':''}"></i><div><b>${esc(e.state.replaceAll('_',' '))}</b><small>${esc(e.detail)} ${e.packetId?'· '+esc(e.packetId.slice(0,8)):''}</small></div><time>${e.time.toLocaleTimeString()}</time></div>`).join(''):'<div class="empty-state compact"><span>⌁</span><b>No sync events yet</b><small>Send or queue a simulated payment to see its trace.</small></div>'}</div></article><article class="card"><div class="card-head"><div><span class="eyebrow">PROTOCOL PIPELINE</span><h3>What happens to a request</h3></div></div><div class="protocol-list"><div><i>01</i><span><b>Local intent</b><small>Saved in this browser when offline</small></span></div><div><i>02</i><span><b>Encrypted packet</b><small>Demo backend creates a hybrid-encrypted payload</small></span></div><div><i>03</i><span><b>Mesh gossip</b><small>Virtual peers forward packets by TTL</small></span></div><div><i>04</i><span><b>Bridge ingest</b><small>Server validates freshness and deduplicates</small></span></div><div><i>05</i><span><b>Ledger response</b><small>Only the server's result marks simulated success</small></span></div></div><div class="notice" style="margin-top:14px">This is a local observability view. The server currently uses H2 and an in-memory idempotency cache; it is not a production payment network.</div></article></section>`)}function settingsPage(){return shell('Settings',`<div class="greet"><div><h1>Settings</h1><p>Local preferences for this browser.</p></div></div><div class="pagegrid"><div class="card"><h2 style="font:700 15px Manrope">Bright by design</h2><p class="foot">Relay uses a light palette with colorful accents and motion.</p><span class="status">LIGHT THEME</span></div><div class="card"><h2 style="font:700 15px Manrope">Demo profile</h2><p class="foot" style="line-height:1.8">${esc(userName())} · ${esc(auth.contact||'')}<br><b style="color:#c38032">Demo OTP session · email/SMS is not sent.</b></p><button class="btn secondary" onclick="signOut()">Sign out</button></div></div>`)}
function loginPage(){if(auth.guestMode)return `<div style="min-height:100vh;display:grid;place-items:center;padding:20px"><div class="card" style="width:min(470px,100%);padding:28px"><a class="brand" href="#/"><span class="mark">R</span><span>RELAY<small>GUEST PREVIEW</small></span></a><h1 style="font:750 24px Manrope;margin:28px 0 7px">Welcome to Relay</h1><p class="foot" style="line-height:1.7">You are exploring a public, guest-only preview. It does not collect contact details or send OTPs.</p><div class="notice" style="margin:18px 0">Read-only mode · simulated data · no real payments</div><button class="btn primary" onclick="go('/dashboard')">Continue as Guest →</button><a href="#/" class="foot" style="display:block;margin-top:18px">← Back to Relay</a></div></div>`;return `<div style="min-height:100vh;display:grid;place-items:center;padding:20px"><div class="card" style="width:min(470px,100%);padding:28px"><a class="brand" href="#/"><span class="mark">↗</span><span>relay<small>OFFLINE PAYMENTS</small></span></a><h1 style="font:750 24px Manrope;margin:28px 0 7px">Sign in to Relay</h1><p class="foot" style="line-height:1.7">Verify your email address or phone number with a one-time code. In this demo, the code is shown here and is not sent.</p><div class="form"><div class="field"><label>DISPLAY NAME</label><input id="loginName" placeholder="Alex Morgan" maxlength="80" autocomplete="name"></div><div class="field"><label>GMAIL OR PHONE NUMBER</label><input id="loginContact" placeholder="you@gmail.com or +14155550123" autocomplete="email tel"></div><button class="btn primary" onclick="requestOtp()">Generate demo OTP →</button><div id="otpArea" class="hidden"><div id="otpHint" class="notice"></div><div class="field" style="margin-top:12px"><label>ONE-TIME CODE</label><input id="loginCode" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code"></div><button class="btn primary" onclick="verifyOtp()">Verify and continue →</button></div><div id="loginError" class="foot" role="alert"></div></div><div class="notice" style="margin-top:18px">Demo sign-in only. No email or SMS is delivered. OTP verification proves access only within this running demo; it does not identify the real person.</div><a href="#/" class="foot" style="display:block;margin-top:18px">← Back to Relay</a></div></div>`}async function requestOtp(){let error=document.getElementById('loginError');error.textContent='';try{let r=await api('/api/auth/request-otp',{method:'POST',body:JSON.stringify({contact:document.getElementById('loginContact').value})});loginChallenge=r.challengeId;loginOtp=r.demoOtp;document.getElementById('otpArea').classList.remove('hidden');document.getElementById('otpHint').textContent='DEMO OTP: '+r.demoOtp+' · expires in '+Math.floor(r.expiresInSeconds/60)+' minutes · not sent';document.getElementById('loginCode').focus()}catch(e){error.textContent=e.message+' Check the email/phone format and resend limit.'}}
async function verifyOtp(){let error=document.getElementById('loginError');error.textContent='';try{auth=await api('/api/auth/verify-otp',{method:'POST',body:JSON.stringify({challengeId:loginChallenge,code:document.getElementById('loginCode').value,displayName:document.getElementById('loginName').value})});loginChallenge='';loginOtp='';go('/dashboard');await render()}catch(e){error.textContent=e.message+' Enter a name and the displayed 6-digit code.'}}
async function signOut(){await api('/api/auth/logout',{method:'POST'}).catch(()=>{});auth={authenticated:false};go('/login');await render()}function publicPage(){let nodeMarkup=(mesh.devices||[]).map((d,i)=>`<div class="mesh-visual-node ${d.hasInternet?'online':''}"><span>${d.hasInternet?'↗':'◌'}</span><b>${esc(d.deviceId)}</b><small>${d.hasInternet?'BRIDGE ONLINE':'OFFLINE PEER'}</small><em>${d.packetCount} packets</em></div>${i<(mesh.devices||[]).length-1?'<i class="mesh-wire">······</i>':''}`).join(''),total=txs.filter(t=>t.status==='SETTLED').length;return `<div class="scroll-progress"><span></span></div><nav class="publicnav"><a class="brand" href="#/"><span class="mark">R</span><span class="brandname">RELAY<small>OFFLINE PAYMENTS</small></span></a><div class="links"><a href="#features">Platform</a><a href="#how">How it works</a><a href="#architecture">Architecture</a><a href="#security">Security</a><a href="#faq">FAQ</a></div><span><a class="btn secondary" href="#/login">Sign in</a> <a class="btn primary" href="#/dashboard">Get started ↗</a></span></nav><section class="hero launch-hero"><div data-reveal><span class="eyebrow">✦ &nbsp; OFFLINE-FIRST PAYMENT EXPERIENCE</span><h1>When the network pauses.<br><em>Life keeps moving.</em></h1><p>Meet Relay: an interactive look at deferred payment requests, encrypted packet delivery and synchronization—built to explore the moments your connection disappears.</p><div class="hero-ctas"><a class="btn primary" href="#/dashboard">Enter the live sandbox ↗</a><a class="btn secondary" href="#how">Explore the technology ↓</a></div><div class="hero-proof"><span><i class="proof-dot"></i> ${systemHealth.status==='UP'?'DEMO API LIVE':'DEMO API OFFLINE'}</span><span>${apiLatency===null?'—':apiLatency+' ms'} response</span><span>${total} ledger confirmations</span></div><small class="hero-disclaimer">A simulation only. No UPI network or real funds are involved.</small></div><div class="hero-art" data-reveal><div class="hero-frame"><div class="frame-top"><span>◉ &nbsp; relay &nbsp; / &nbsp; wallet</span><span class="frame-dots"><i></i><i></i><i></i></span></div><div class="frame-content"><span class="frame-label">YOUR DEMO BALANCE</span><div class="frame-balance"><div><b>${fmt(balance())}</b><small>alice@demo · simulated ledger</small></div><span>↗ &nbsp; Activity</span></div><div class="frame-widgets"><div class="frame-widget"><h4>Cashflow · actual ledger</h4><div class="mini-chart">${Array.from({length:12},(_,i)=>{let n=txs.filter(t=>t.status==='SETTLED'&&new Date(t.settledAt).getMonth()===i).reduce((a,t)=>a+Number(t.amount),0),max=Math.max(1,...txs.map(t=>Number(t.amount)));return `<i style="height:${n?Math.min(95,18+n/(max*12)*78):8}%"></i>`}).join('')}</div></div><div class="frame-widget"><h4>Activity feed</h4><div class="frame-txs">${txs.slice(0,3).map(t=>`<div><i>↗</i>${esc(t.receiverVpa)}<b>${fmt(t.amount)}</b></div>`).join('')||'<div><i>◷</i>Queue ready</div><div><i>✦</i>Demo live</div>'}</div></div></div></div></div><div class="phone-stack"><div class="mock-phone back"><div class="phone-notch"></div><div class="phone-ui"><small>RELAY · PEOPLE</small><b>Choose recipient</b><div class="phone-row">◉ &nbsp; alice@demo</div><div class="phone-row">◉ &nbsp; bob@demo</div><div class="phone-row">◉ &nbsp; carol@demo</div></div></div><div class="mock-phone mid"><div class="phone-notch"></div><div class="phone-ui"><small>RELAY · SCAN</small><b>Scan & Pay</b><div class="scan-frame" style="width:92px;height:92px;margin:17px auto"><span class="scan-corners"></span></div><small>Find a demo recipient</small></div></div><div class="mock-phone front"><div class="phone-notch"></div><div class="phone-ui"><small>GOOD EVENING, ${esc(userName().split(' ')[0])}</small><b>Your wallet</b><div class="phone-balance"><small>DEMO BALANCE</small><br><strong>${fmt(balance())}</strong></div><div class="phone-actions"><i>↗</i><i>▦</i><i>◷</i><i>↙</i></div><div class="phone-row">${online()?'● Connected':'○ Offline'} · local queue ready</div></div></div></div></div></section><div class="spec-ribbon"><div><b>RSA-2048</b><span>EPHEMERAL DEMO KEY</span></div><i></i><div><b>AES-256-GCM</b><span>AUTHENTICATED ENVELOPE</span></div><i></i><div><b>SHA-256</b><span>PACKET DEDUPLICATION</span></div><i></i><div><b>${(mesh.devices||[]).length}</b><span>VIRTUAL MESH NODES</span></div><i></i><div><b>H2 LEDGER</b><span>LOCAL SIMULATION</span></div></div><section class="story-section product-story" id="platform" data-reveal><div class="story-copy"><span class="eyebrow">A DIFFERENT KIND OF PAYMENT DEMO</span><h2>Designed for the gap between <em>offline</em> and <em>confirmed.</em></h2><p>Most payment demos start and finish in one request. Relay lets you follow the full deferred-settlement story: local intent, packet creation, peer forwarding, bridge delivery and the final server response.</p><p>Every view separates a request waiting on this device from a simulated payment recorded in the backend.</p><a class="text-link" href="#/dashboard/system">Explore live system telemetry ↗</a></div><div class="story-card stack-visual"><div class="stack-label">PAYMENT REQUEST · LIFECYCLE</div><div class="stack-row queued"><span>01</span><div><b>Local request</b><small>Saved in this browser</small></div><em>QUEUED</em></div><div class="stack-row"><span>02</span><div><b>Encrypted packet</b><small>Hybrid envelope created by demo server</small></div><em>SEALED</em></div><div class="stack-row"><span>03</span><div><b>Mesh forwarding</b><small>Virtual devices gossip the packet</small></div><em>ROUTED</em></div><div class="stack-row"><span>04</span><div><b>Bridge delivery</b><small>Server checks freshness and duplicates</small></div><em>SYNC</em></div><div class="stack-row"><span>05</span><div><b>Ledger result</b><small>Authoritative simulated outcome</small></div><em>SERVER</em></div></div></section><section class="sect detail-section" id="features" data-reveal><div class="section-heading"><span class="eyebrow">THE RELAY TOOLKIT</span><h2>More than an offline badge.</h2><p>Explore the mechanics behind an offline-first payment flow through real endpoints from the included demo backend.</p></div><div class="feature-grid"><article class="feature-card feature-large"><span class="feature-num">01 / PERSIST</span><span class="feature-glyph">◷</span><h3>Queue on the device</h3><p>Payment intent survives a page reload in browser storage. It stays visibly queued until a real server response changes its state.</p><div class="feature-mini"><b>${queue.filter(q=>q.state==='QUEUED').length}</b><small>requests waiting locally</small></div></article><article class="feature-card"><span class="feature-num">02 / ENVELOPE</span><span class="feature-glyph purple">⌑</span><h3>Hybrid packet encryption</h3><p>The simulator wraps an AES-256-GCM payload key with RSA-OAEP for the server.</p></article><article class="feature-card"><span class="feature-num">03 / FORWARD</span><span class="feature-glyph cyan">⌁</span><h3>Virtual mesh gossip</h3><p>Run a round and inspect real packet counts across the five virtual devices.</p></article><article class="feature-card"><span class="feature-num">04 / DEDUPLICATE</span><span class="feature-glyph pink">⟲</span><h3>Idempotent ingestion</h3><p>Ciphertext hashes and a unique ledger constraint help stop duplicate simulated settlement.</p></article><article class="feature-card feature-wide"><span class="feature-num">05 / OBSERVE</span><span class="feature-glyph green">⌘</span><h3>See the system, not just the screen</h3><p>Check API reachability, response time, mesh nodes, public-key details and the local sync trace in Network Monitor.</p><a class="text-link" href="#/dashboard/system">Open Network Monitor ↗</a></article></div></section><section class="flow-section" id="how" data-reveal><div class="section-heading"><span class="eyebrow">FROM TAP TO SERVER RESULT</span><h2>Five stages. One honest status.</h2><p>Follow a request through the same demo APIs that power the dashboard.</p></div><div class="flow-track"><article><span class="flow-index">01</span><div class="flow-icon">＋</div><h3>Prepare</h3><p>Select sender, recipient and amount. The browser creates a unique local request ID.</p><small>PAYMENT FORM</small></article><article><span class="flow-index">02</span><div class="flow-icon">◷</div><h3>Queue</h3><p>Save the request on this device. Queued does not mean authorized or settled.</p><small>LOCAL STORAGE</small></article><article><span class="flow-index">03</span><div class="flow-icon">⌑</div><h3>Seal</h3><p>The demo backend creates a hybrid-encrypted packet with freshness metadata.</p><small>RSA-OAEP · AES-GCM</small></article><article><span class="flow-index">04</span><div class="flow-icon">⌁</div><h3>Relay</h3><p>Virtual peers gossip the packet. A bridge node sends it to ingestion.</p><small>TTL · BRIDGE INGEST</small></article><article><span class="flow-index">05</span><div class="flow-icon">✓</div><h3>Confirm</h3><p>Server validates and attempts the ledger update, then returns the outcome.</p><small>SIMULATED LEDGER</small></article></div></section><section class="architecture-section" id="architecture" data-reveal><div class="section-heading"><span class="eyebrow">UNDER THE INTERFACE</span><h2>A small system you can inspect.</h2><p>Relay exposes its working parts instead of hiding the demo behind static product claims.</p></div><div class="architecture-layout"><div class="arch-selector"><button class="arch-tab active" onclick="showArchitecture('browser',this)"><i>01</i><span><b>Browser client</b><small>Offline queue · status</small></span>›</button><button class="arch-tab" onclick="showArchitecture('api',this)"><i>02</i><span><b>Spring API</b><small>Validation · ingestion</small></span>›</button><button class="arch-tab" onclick="showArchitecture('mesh',this)"><i>03</i><span><b>Mesh simulator</b><small>Peer gossip · TTL</small></span>›</button><button class="arch-tab" onclick="showArchitecture('ledger',this)"><i>04</i><span><b>H2 ledger</b><small>Balance · transaction</small></span>›</button></div><div class="arch-detail" id="archDetail"><span class="eyebrow">01 / CLIENT LAYER</span><h3>Requests remain local until sync.</h3><p>The browser queue persists in IndexedDB with a localStorage fallback. It never stores passwords, OTPs, or payment PINs. Online status is only a hint; the app measures backend reachability separately.</p><div class="arch-code"><span>navigator.onLine</span><i>+</i><span>GET /api/health</span><i>→</i><b>Reachability signal</b></div></div></div></section><section class="mesh-section" id="mesh" data-reveal><div class="section-heading"><span class="eyebrow">LIVE VIRTUAL NETWORK</span><h2>Five devices. One route to the server.</h2><p>This topology is populated from <code>/api/mesh/state</code> right now.</p></div><div class="mesh-livebar"><span><i class="pulse-dot"></i> ${systemHealth.status==='UP'?'DEMO BACKEND REACHABLE':'BACKEND UNAVAILABLE'}</span><b>${apiLatency===null?'—':apiLatency+' ms'}</b><small>${(mesh.devices||[]).reduce((n,d)=>n+d.packetCount,0)} packets currently held</small><button class="btn secondary" onclick="refreshPublicMesh()">↻ Refresh live state</button></div><div class="mesh-visual">${nodeMarkup||'<div class="empty">Connect to the demo server to view the mesh.</div>'}</div><p class="mesh-caption">Virtual peers model the route for learning. No Bluetooth radio or real handset forwarding is used.</p></section><section class="technical-section" id="technical" data-reveal><div class="section-heading"><span class="eyebrow">TECHNICAL DEEP DIVE</span><h2>What is inside a packet?</h2><p>The transport envelope can route without exposing the encrypted instruction to virtual peers.</p></div><div class="packet-diagram"><div class="packet-side"><span>ROUTING METADATA</span><b>Packet ID · TTL · createdAt</b><small>Visible to the simulator so it can forward and deduplicate.</small></div><div class="packet-lock">⌑</div><div class="packet-side sealed"><span>ENCRYPTED PAYMENT PAYLOAD</span><b>Sender · recipient · amount · nonce · signedAt</b><small>Wrapped with AES-GCM; the AES key is wrapped with the server public key.</small></div></div><div class="tech-notes"><article><b>01 · AES-GCM</b><p>Authenticated encryption detects payload tampering during decryption.</p></article><article><b>02 · FRESHNESS</b><p>The server rejects packets outside its configured age window.</p></article><article><b>03 · IDEMPOTENCY</b><p>SHA-256 of ciphertext is claimed before settlement; the ledger has a unique packet hash.</p></article><article><b>04 · ATOMIC LEDGER</b><p>Debit and credit run within a database transaction with optimistic account locking.</p></article></div><div class="technical-caveat">The current simulator creates packets server-side to model a sender. Real offline signing and funds reservation would require a dedicated trusted mobile client and a different financial design.</div></section><section class="security-section" id="security" data-reveal><div><span class="eyebrow">TRUST THROUGH TRANSPARENCY</span><h2>What this demo does—and what it doesn’t.</h2><p>Great payment UX starts with clear state. Relay labels local queue, server processing, rejection and confirmed simulated settlement separately.</p></div><div class="security-grid"><article><span>✓</span><h3>Implemented in the demo</h3><ul><li>Hybrid packet encryption</li><li>Freshness and replay checks</li><li>Server-side balance validation</li><li>Idempotent simulated settlement</li><li>HTTP-session demo OTP sign-in</li></ul></article><article class="limitation-card"><span>!</span><h3>Not a production payment product</h3><ul><li>No real Gmail or SMS OTP delivery</li><li>No UPI, bank or payment-network integration</li><li>H2 and idempotency are in-memory/local demo choices</li><li>Browser storage is not secure wallet storage</li><li>No bank authorization or offline funds guarantee</li></ul></article></div></section><section class="faq-section" id="faq" data-reveal><div><span class="eyebrow">COMMON QUESTIONS</span><h2>Clear answers, before you explore.</h2><p>Everything here is designed to be honest about what the simulator does.</p></div><div class="faq-list"><details><summary>Is this a real UPI payment? <span>＋</span></summary><p>No. It is a simulated ledger and never reaches UPI, a bank, or a payment service.</p></details><details><summary>Does an offline request mean the receiver is paid? <span>＋</span></summary><p>No. It is only a local request until the backend processes it. Offline queueing does not reserve funds or guarantee settlement.</p></details><details><summary>Does Relay send the OTP to my email or phone? <span>＋</span></summary><p>No. The current OTP flow is a local demonstration and shows the generated code in the page.</p></details><details><summary>Can I inspect the technical flow? <span>＋</span></summary><p>Yes. Open the Network Monitor after signing in to inspect live API status, virtual device packet counts, the server public-key profile and recent sync events.</p></details></div></section><section class="final-cta" data-reveal><span class="eyebrow">READY TO GET HANDS-ON?</span><h2>Step into the live sandbox.</h2><p>Queue a request, watch a virtual mesh round and inspect the server’s simulated result.</p><a class="btn primary" href="#/dashboard">Launch Relay ↗</a><a class="text-link" href="#/dashboard/system">Open technical monitor ↗</a></section><footer class="footer"><span>RELAY · SIMULATED PAYMENT EXPERIENCE</span><span>Not a bank · Not connected to UPI · No real money moves</span><a href="#/login">Demo sign in</a></footer>`}
function showArchitecture(key,button){let data={browser:['01 / CLIENT LAYER','Requests remain local until sync.','The browser queue persists in IndexedDB with a localStorage fallback. It never stores passwords, OTPs, or payment PINs. Online status is only a hint; the app measures backend reachability separately.','navigator.onLine + GET /api/health → Reachability signal'],api:['02 / SERVICE LAYER','Validate before the ledger.','Spring Boot exposes REST routes for demo packet creation, bridge ingestion, account state, transaction history and health. The bridge checks payload freshness before settlement.','POST /api/demo/send → encrypted MeshPacket'],mesh:['03 / TRANSPORT LAYER','Forward across virtual peers.','The simulator gossips packets through virtual devices with a time-to-live. The internet-connected bridge uploads held packets to the ingestion service.','phone-alice → peer devices → phone-bridge'],ledger:['04 / PERSISTENCE LAYER','Record the authoritative result.','Settlement validates accounts and balances, then updates both sides of the simulated ledger in a database transaction. H2 resets when the app restarts.','SettlementService → H2 transaction']};let d=data[key];let target=document.getElementById('archDetail');if(target)target.innerHTML=`<span class="eyebrow">${esc(d[0])}</span><h3>${esc(d[1])}</h3><p>${esc(d[2])}</p><div class="arch-code">${esc(d[3])}</div>`;document.querySelectorAll('.arch-tab').forEach(x=>x.classList.remove('active'));if(button)button.classList.add('active')}
async function refreshPublicMesh(){await load();if(path()==='/')await render();toast(systemHealth.status==='UP'?'Live network state refreshed':'Backend unavailable')}
function initScrollEffects(){let bar=document.querySelector('.scroll-progress span');if(bar){let max=document.documentElement.scrollHeight-innerHeight;bar.style.width=(max>0?Math.min(100,scrollY/max*100):0)+'%'}let nodes=document.querySelectorAll('[data-reveal]:not(.revealed):not(.reveal-observed)');if(!nodes.length)return;if(!('IntersectionObserver'in window)){nodes.forEach(n=>n.classList.add('revealed'));return}if(!revealObserver)revealObserver=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('revealed');revealObserver.unobserve(e.target)}}),{threshold:.12});nodes.forEach(n=>{n.classList.add('reveal-observed');revealObserver.observe(n)})}
async function boot(){await render();if(auth.authenticated&&online())await syncQueue(false)}async function render(){await load();let p=path();if(p==='/'){app.innerHTML=publicPage()}else if(p==='/login'){app.innerHTML=loginPage()}else if(!auth.authenticated){go('/login');app.innerHTML=loginPage()}else{let pages={'/dashboard':()=>dashboard(),'/dashboard/send':()=>sendPage(),'/dashboard/receive':()=>receivePage(),'/dashboard/scan':()=>scanPage(),'/dashboard/offline':()=>offlinePage(),'/dashboard/transactions':()=>txPage(),'/dashboard/beneficiaries':()=>benefPage(),'/dashboard/analytics':()=>analyticsPage(),'/dashboard/system':()=>systemPage(),'/dashboard/settings':()=>settingsPage()};app.innerHTML=(pages[p]||pages['/dashboard'])()}initScrollEffects()}
window.addEventListener('hashchange',()=>{if(location.hash&&!location.hash.startsWith('#/')){let id=decodeURIComponent(location.hash.slice(1));document.getElementById(id)?.scrollIntoView({behavior:'smooth'});return}render().catch(e=>{app.innerHTML='<main style="padding:48px;color:#f5f6fa;font:16px sans-serif">Relay could not load this view. Refresh the page to try again.</main>';console.error(e)})});window.addEventListener('scroll',()=>{let bar=document.querySelector('.scroll-progress span');if(bar){let max=document.documentElement.scrollHeight-innerHeight;bar.style.width=(max>0?Math.min(100,scrollY/max*100):0)+'%'}},{passive:true});window.addEventListener('online',()=>{load().then(()=>{if(auth.authenticated)syncQueue(false);else render()})});window.addEventListener('offline',()=>render());boot().catch(e=>{app.innerHTML='<main style="padding:48px;color:#f5f6fa;font:16px sans-serif">Relay could not load. Check that the demo server is running, then refresh.</main>';console.error(e)});
