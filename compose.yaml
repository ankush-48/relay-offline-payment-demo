services:
  relay:
    build: .
    ports:
      - "8080:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      PORT: 8080
      DB_URL: jdbc:h2:file:/app/data/relaydb
      DB_USERNAME: sa
      DB_PASSWORD: ""
      H2_CONSOLE_ENABLED: "false"
      RELAY_DEMO_READ_ONLY: "false"
      SESSION_COOKIE_SECURE: "false"
    volumes:
      - relay-data:/app/data
    restart: unless-stopped

volumes:
  relay-data:
