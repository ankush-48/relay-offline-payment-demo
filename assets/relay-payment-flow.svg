<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="430" viewBox="0 0 1440 430" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="430" gradientUnits="userSpaceOnUse"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#111D2B"/></linearGradient>
    <linearGradient id="route" x1="97" y1="0" x2="1307" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#A78BFA"/><stop offset=".52" stop-color="#51DACA"/><stop offset="1" stop-color="#6A8DFF"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#212B44"/><stop offset="1" stop-color="#151D30"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .packet{animation:travel 8s linear infinite}.pulse{animation:pulse 1.8s ease-in-out infinite alternate}
      @keyframes travel{0%{transform:translateX(0)}100%{transform:translateX(1200px)}}
      @keyframes pulse{from{opacity:.45}to{opacity:1}}
      @media(prefers-reduced-motion:reduce){.packet,.pulse{animation:none}}
    </style>
  </defs>
  <rect width="1440" height="430" rx="28" fill="url(#bg)"/>
  <path d="M0 84H1440M0 347H1440" stroke="#A8B8D8" stroke-opacity=".07"/>
  <text x="60" y="52" fill="#6C7B98" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">THE REQUEST'S JOURNEY</text>
  <text x="60" y="78" fill="#EDF2FF" font-family="Arial,sans-serif" font-size="21" font-weight="700">A visible, simulated offline-to-server workflow</text>
  <path d="M118 199H1322" stroke="#33415E" stroke-width="4" stroke-linecap="round"/>
  <path d="M118 199H1322" stroke="url(#route)" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 12" opacity=".65"/>
  <g class="packet" filter="url(#glow)"><circle cx="118" cy="199" r="7" fill="#6BE5D5"/><circle cx="118" cy="199" r="14" stroke="#6BE5D5" stroke-opacity=".38"/></g>
  <g transform="translate(48 118)"><rect width="224" height="164" rx="18" fill="url(#shine)" stroke="#8C7AF4" stroke-opacity=".55"/><circle class="pulse" cx="35" cy="35" r="16" fill="#322B61"/><text x="29" y="41" fill="#C1B5FF" font-family="Arial,sans-serif" font-size="18" font-weight="700">01</text><text x="25" y="82" fill="#F1F3FF" font-family="Arial,sans-serif" font-size="17" font-weight="700">Queue on device</text><text x="25" y="108" fill="#AAB6CE" font-family="Arial,sans-serif" font-size="12">Saved locally while offline</text><text x="25" y="132" fill="#8C7AF4" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">INDEXEDDB · BROWSER</text></g>
  <g transform="translate(333 118)"><rect width="224" height="164" rx="18" fill="url(#shine)" stroke="#6DDDD0" stroke-opacity=".55"/><circle class="pulse" cx="35" cy="35" r="16" fill="#194A4B"/><text x="29" y="41" fill="#9AF0E3" font-family="Arial,sans-serif" font-size="18" font-weight="700">02</text><text x="25" y="82" fill="#F1F3FF" font-family="Arial,sans-serif" font-size="17" font-weight="700">Seal the payload</text><text x="25" y="108" fill="#AAB6CE" font-family="Arial,sans-serif" font-size="12">AES-GCM + RSA-OAEP</text><text x="25" y="132" fill="#6DDDD0" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">ENCRYPTED DEMO PACKET</text></g>
  <g transform="translate(618 118)"><rect width="224" height="164" rx="18" fill="url(#shine)" stroke="#8C7AF4" stroke-opacity=".55"/><circle class="pulse" cx="35" cy="35" r="16" fill="#322B61"/><text x="29" y="41" fill="#C1B5FF" font-family="Arial,sans-serif" font-size="18" font-weight="700">03</text><text x="25" y="82" fill="#F1F3FF" font-family="Arial,sans-serif" font-size="17" font-weight="700">Relay through peers</text><text x="25" y="108" fill="#AAB6CE" font-family="Arial,sans-serif" font-size="12">Virtual mesh + packet TTL</text><text x="25" y="132" fill="#A891FF" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">SIMULATED DEVICES</text></g>
  <g transform="translate(903 118)"><rect width="224" height="164" rx="18" fill="url(#shine)" stroke="#6DDDD0" stroke-opacity=".55"/><circle class="pulse" cx="35" cy="35" r="16" fill="#194A4B"/><text x="29" y="41" fill="#9AF0E3" font-family="Arial,sans-serif" font-size="18" font-weight="700">04</text><text x="25" y="82" fill="#F1F3FF" font-family="Arial,sans-serif" font-size="17" font-weight="700">Sync to the server</text><text x="25" y="108" fill="#AAB6CE" font-family="Arial,sans-serif" font-size="12">Bridge ingest + replay checks</text><text x="25" y="132" fill="#6DDDD0" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">VALIDATE · DEDUPLICATE</text></g>
  <g transform="translate(1188 118)"><rect width="224" height="164" rx="18" fill="url(#shine)" stroke="#7795FF" stroke-opacity=".6"/><circle class="pulse" cx="35" cy="35" r="16" fill="#263A70"/><text x="29" y="41" fill="#B8C9FF" font-family="Arial,sans-serif" font-size="18" font-weight="700">05</text><text x="25" y="82" fill="#F1F3FF" font-family="Arial,sans-serif" font-size="17" font-weight="700">Record demo result</text><text x="25" y="108" fill="#AAB6CE" font-family="Arial,sans-serif" font-size="12">Atomic simulated ledger update</text><text x="25" y="132" fill="#8DA8FF" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">SETTLED · REJECTED · DUPLICATE</text></g>
  <text x="60" y="328" fill="#8492AC" font-family="Arial,sans-serif" font-size="12">A queued request is not a payment confirmation. Settlement occurs only in the demo ledger after server processing.</text>
  <rect x="60" y="364" width="355" height="34" rx="17" fill="#202940"/><circle cx="80" cy="381" r="5" fill="#F7C66B"/><text x="94" y="385" fill="#CAD3E5" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing=".6">SIMULATED TRANSPORT · NOT BLUETOOTH</text>
  <rect x="430" y="364" width="328" height="34" rx="17" fill="#202940"/><circle cx="450" cy="381" r="5" fill="#4DDFB8"/><text x="464" y="385" fill="#CAD3E5" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing=".6">NO REAL UPI · NO REAL MONEY MOVES</text>
</svg>
